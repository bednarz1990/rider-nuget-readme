name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Build, test, and validate plugin structure
        run: gradle --no-daemon build buildPlugin verifyPluginProjectConfiguration verifyPluginStructure
      - name: Verify binary compatibility with target Rider
        run: gradle --no-daemon verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-verifier-reports
          path: build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: rider-nuget-readme-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
  live-nuget:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: gradle --no-daemon integrationTest
